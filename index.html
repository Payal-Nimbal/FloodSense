<!DOCTYPE html>
<html>
<head>
    <title>FloodSense Dashboard</title>
    <link rel="stylesheet"
href="style.css">
</head>
<body>

<h1>🌊 FloodSense</h1>
<h2>Smart Flood Monitoring System</h2>

<div class="card">
    <h3>Water Level Monitoring</h3>
    <p class="level" id="water">20 cm</p>
    <h3 id="status">Normal Condition</h3>
    <button onclick="checkLevel()">Check Water Level</button>
</div>

<script>
function checkLevel() {
    let level = Math.floor(Math.random() * 40) + 1;

    document.getElementById("water").innerHTML =
        level + " cm";

    if (level < 10) {
        document.getElementById("status").innerHTML =
            "🚨 FLOOD ALERT!";
    } else {
        document.getElementById("status").innerHTML =
            "✅ Normal Condition";
    }
}
</script>

</body>
</html>
