<script>
function checkLevel() {

    let level = Math.floor(Math.random() * 51);

    document.getElementById("water").innerHTML =
        level + " cm";

    let status = document.getElementById("status");

    if (level < 20) {
        status.innerHTML = "Normal Condition";
        status.style.color = "green";
    }
    else if (level < 35) {
        status.innerHTML = "WARNING! Water Level Rising";
        status.style.color = "orange";
    }
    else {
        status.innerHTML = "🚨 FLOOD ALERT!";
        status.style.color = "red";
        alert("Flood Alert! High Water Level Detected");
    }
}
</script>
